[package]
name = "zaphire-app"
description = "Zaphire browser executable (CEF / Chromium)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zaphire"
path = "src/main.rs"

[dependencies]
cef.workspace = true
zaphire-core.workspace = true
zaphire-ipc.workspace = true
zaphire-adblock.workspace = true
zaphire-perf.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
