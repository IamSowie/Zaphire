[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
zaphire-core = { path = "crates/zaphire-core" }
zaphire-ipc = { path = "crates/zaphire-ipc" }
zaphire-adblock = { path = "crates/zaphire-adblock" }
zaphire-perf = { path = "crates/zaphire-perf" }
cef = { version = "=156.7.0", default-features = false, features = ["build-util", "resources"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
dirs = "6"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
