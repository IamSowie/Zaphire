name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck && npm test && npm run build
        working-directory: ui

  core:
    name: core crates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zaphire-core -p zaphire-perf -p zaphire-ipc -p zaphire-adblock
      - run: cargo clippy -p zaphire-core -p zaphire-perf -p zaphire-ipc -p zaphire-adblock -- -D warnings

  app:
    name: browser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libnss3 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
      # CEF binaries (~1 GB unpacked) are downloaded by cef-dll-sys; cache them.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/cef
          key: cef-156.7.0-${{ runner.os }}
      - name: Fetch CEF
        shell: bash
        run: |
          if [ ! -f "$HOME/.local/share/cef/archive.json" ]; then
            cargo install export-cef-dir --version 156.7.0 --locked || true
            export-cef-dir --force "$HOME/.local/share/cef"
          fi
          CEF="$HOME/.local/share/cef"
          # Rust on Windows needs C:/… paths, not Git Bash's /c/….
          if command -v cygpath >/dev/null; then CEF="$(cygpath -m "$CEF")"; fi
          echo "CEF_PATH=$CEF" >> "$GITHUB_ENV"
          ls "$CEF" | head -20
      - uses: Swatinem/rust-cache@v2
      - name: Package
        shell: bash
        run: scripts/package.sh release
      - name: AppImage + portable tarball
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/appimage.sh
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tar -C dist -czf "dist/Zaphire-$V-linux-x86_64-portable.tar.gz" zaphire-linux
      - name: Installer + portable zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          "$ISCC" "/DAppVersion=$V" packaging/windows/zaphire.iss
          (cd dist && 7z a -tzip "Zaphire-$V-windows-x64-portable.zip" zaphire-windows >/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: zaphire-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ui, core, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
